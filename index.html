<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#241207">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>حلويات أبو طارق الغاوي - لعبة أبو أمير</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#170c05;color:#fff;font-family:Cairo,Arial,sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#game{position:relative;width:100%;max-width:650px;height:100dvh;margin:auto;overflow:hidden;isolation:isolate;background:#29170d}
#shopBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:-3;filter:brightness(.57) saturate(1.1)}
#shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,#100600b8 0%,#160a0030 24%,#16090025 55%,#100700d9 100%)}
header{height:66px;position:relative;z-index:10;display:flex;align-items:flex-start;justify-content:space-between;padding:8px 9px;gap:5px}
.hud{display:flex;gap:5px;align-items:center}
.pill{height:43px;border:2px solid #d08a37;border-radius:24px;background:linear-gradient(#3d210e,#140a04);box-shadow:0 3px 0 #080300,inset 0 1px #ffdc9a;display:flex;align-items:center;gap:6px;padding:3px 9px;font-weight:900}
.coin{font-size:24px;color:#ffd94d}.count{font-size:19px;min-width:35px;text-align:center}
.plus{height:34px;width:34px;border-radius:50%;background:linear-gradient(#6cf04a,#078c25);border:2px solid #d2ffb9;font-size:24px;font-weight:900}
.star{font-size:29px;color:#ffdc3e;text-shadow:0 2px 5px #7b3c00}
.pause{height:43px;width:43px;border-radius:50%;background:linear-gradient(#54caff,#0755b8);border:3px solid #a9eaff;font-size:19px;box-shadow:0 3px 6px #0009}
.brand{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:54%;text-align:center;font-size:clamp(15px,4vw,25px);font-weight:900;line-height:1.12;color:#fff;text-shadow:0 0 5px #fff,0 0 13px #bd83ff,0 0 25px #7d2bd1;pointer-events:none}
.brand small{display:block;font-size:clamp(9px,2.5vw,13px);color:#ffe6bb;text-shadow:0 0 7px #d88b2b}
.order{position:absolute;top:72px;right:10px;left:10px;z-index:8;border:2px solid #e3a448;border-radius:15px;background:#160c05e8;padding:7px 10px;display:flex;align-items:center;justify-content:space-between;gap:7px;box-shadow:0 4px 10px #0008}
.order strong{font-size:clamp(12px,3.2vw,16px);line-height:1.3}.order small{display:block;color:#ffcf76;font-size:10px}.reward{white-space:nowrap;color:#ffe07a;font-size:13px;font-weight:900}
.worker{position:absolute;z-index:2;bottom:19%;left:30%;height:53%;width:43%;object-fit:contain;object-position:bottom center;filter:drop-shadow(0 7px 9px #000b);transform-origin:bottom center;animation:idle 3s ease-in-out infinite;cursor:pointer}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes proud{0%,100%{transform:scale(1)}40%{transform:scale(1.06) translateY(-8px)}}
@keyframes laugh{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-4deg) translateY(-10px)}40%{transform:rotate(4deg) translateY(-3px)}60%{transform:rotate(-3deg) translateY(-8px)}80%{transform:rotate(3deg)}}
@keyframes tired{0%,100%{transform:rotate(0)}35%{transform:rotate(5deg) translateX(5px)}70%{transform:rotate(-4deg)}}
.worker.proud{animation:proud .75s ease}.worker.laugh{animation:laugh .85s ease}.worker.tired{animation:tired .9s ease}
.bubble{position:absolute;right:7%;top:24%;width:38%;z-index:5;background:#fff8e8;color:#241307;border:4px solid #75411e;border-radius:25px;padding:10px 8px;text-align:center;font-weight:900;font-size:clamp(14px,3.8vw,22px);line-height:1.35;box-shadow:0 5px 10px #0009;min-height:65px}
.bubble:after{content:"";position:absolute;bottom:-14px;left:18px;width:20px;height:20px;background:#fff8e8;border-left:4px solid #75411e;border-bottom:4px solid #75411e;transform:rotate(-35deg)}
.quick{position:absolute;z-index:7;left:8px;top:26%;width:27%;display:flex;flex-direction:column;gap:9px}
.wood{min-height:59px;padding:7px 6px;border-radius:15px;border:3px solid #d08b43;background:repeating-linear-gradient(4deg,#78380f 0 7px,#9a501b 8px 14px,#6e310c 15px 18px);box-shadow:0 4px 0 #321604,0 7px 9px #0009,inset 0 2px 4px #ffd18a;font-weight:900;text-shadow:0 2px 3px #160600;font-size:clamp(12px,3vw,17px);line-height:1.25}
.wood:active,.green:active{transform:translateY(3px)}
.countertop{position:absolute;z-index:3;bottom:10%;left:0;width:100%;height:25%;background:linear-gradient(#a76029,#6b310f 18%,#321606 100%);border-top:7px solid #d48b46;box-shadow:0 -5px 12px #0009}
.board{position:absolute;z-index:4;bottom:13%;left:21%;width:55%;height:17%;border:5px solid #4d250e;border-radius:12px;background:linear-gradient(130deg,#b9793d,#8a4a1b);box-shadow:0 5px 10px #0009;display:grid;place-items:center}
.cheese{width:73%;height:68%;border-radius:18px 18px 8px 8px;background:linear-gradient(145deg,#fff4cb,#e5d093);box-shadow:inset -8px -8px 14px #b59a68,0 6px 6px #43200b;position:relative}
.cheese:before{content:"";position:absolute;inset:0;border-radius:inherit;background-image:radial-gradient(#728d27 1.5px,transparent 2px);background-size:12px 10px}
.scale{position:absolute;z-index:6;right:3%;bottom:24%;width:30%;height:15%;border:4px solid #444;border-radius:13px;background:linear-gradient(#e3e3e3,#777);box-shadow:0 5px 8px #0009;color:#111;display:flex;align-items:center;justify-content:center;gap:3px}
.display{background:#160c09;border:3px solid #444;border-radius:5px;color:#ff2525;font:900 clamp(21px,5vw,33px) monospace;padding:4px 7px;text-shadow:0 0 8px red}
.kg{font-size:10px;font-weight:900}
.weight-controls{position:absolute;z-index:8;right:4%;bottom:15%;width:31%;display:flex;gap:5px}
.weight-controls button{flex:1;border-radius:9px;background:linear-gradient(#4a9fe9,#1255a5);border:2px solid #b9e5ff;font-size:20px;font-weight:900;box-shadow:0 3px 0 #07315e}
.green{position:absolute;z-index:9;right:5%;bottom:7.7%;width:37%;height:7.5%;border-radius:18px;background:linear-gradient(#75f04a,#0b9b27 65%,#00651a);border:4px solid #c9ffb6;box-shadow:0 5px 0 #073c0d,0 8px 12px #0009,inset 0 3px 5px #fff9;font-size:clamp(22px,6vw,34px);font-weight:900;text-shadow:0 2px 3px #16410b}
.progress-card{position:absolute;z-index:10;bottom:1%;left:32%;width:49%;height:7%;background:#170b05;border:3px solid #ad692e;border-radius:19px;padding:3px 8px;text-align:center;font-weight:900;font-size:clamp(10px,2.6vw,15px);box-shadow:0 4px 0 #080300}
.track{height:11px;border:2px solid #777;border-radius:20px;background:#222;overflow:hidden;margin-top:2px}
.fill{height:100%;width:40%;background:linear-gradient(#8aff42,#18a900)}
.shop-btn{position:absolute;z-index:10;left:2%;bottom:1%;width:28%;height:7%}
.shop-btn .wood{height:100%;min-height:0;width:100%;font-size:clamp(11px,2.8vw,16px)}
.mode{position:absolute;z-index:11;top:122px;left:10px;border:1px solid #ffd078;border-radius:20px;background:#251205dd;padding:4px 8px;font-size:10px;font-weight:900}
.toast{position:absolute;z-index:15;bottom:18%;left:50%;transform:translateX(-50%);background:#170b05ed;border:2px solid #e4ae57;border-radius:15px;padding:7px 12px;font-size:12px;font-weight:900;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.modal{display:none;position:absolute;inset:0;z-index:30;background:#000c;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.dialog{width:100%;max-width:390px;border:3px solid #e0a04a;border-radius:20px;background:linear-gradient(#3a200e,#170b04);padding:17px;text-align:center;box-shadow:0 12px 35px #000}
.dialog h2{margin:0 0 8px;color:#ffdc9d}.dialog p{font-size:13px;color:#f8dfbb}
.dialog .wood{width:100%;margin:7px 0}
.mode-select{display:flex;gap:7px}.mode-select button{flex:1;padding:8px;border-radius:10px;background:#714018;border:2px solid #d49b53;font-weight:900}
@media(max-height:680px){.worker{height:47%;bottom:19%}.quick{top:25%;gap:6px}.wood{min-height:49px}.order{top:64px}.bubble{top:23%}}
</style>
</head>

<button class="wood" onclick="buyUpgrade('sign',400)">💜 أرمة نيون — 400 🪙</button>
<button class="wood" onclick="buyUpgrade('display',600)">🍰 واجهة عرض جديدة — 600 🪙</button>
<div class="mode-select"><button onclick="setMode('levels')">المراحل</button><button onclick="setMode('open')">اللعب المفتوح</button></div>
<button class="wood" onclick="closeModal()">رجوع للعبة</button>
</div></div>
</div>
<script>
let coins=150,level=1,weight=0,target=1,sold=0,totalSold=0,mode='levels',tapIndex=0;
const upgrades=[];
const $=id=>document.getElementById(id);
function say(text,rate=1,pitch=1){if(!('speechSynthesis'in window)){toast('جهازك لا يدعم القراءة الصوتية');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ar';u.rate=rate;u.pitch=pitch;let voices=speechSynthesis.getVoices();let ar=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ar'));if(ar)u.voice=ar;speechSynthesis.speak(u)}
function animate(kind){let a=$('abu');a.classList.remove('proud','laugh','tired');void a.offsetWidth;a.classList.add(kind)}
function abuTap(){let items=[['أنا أبو أمير الملك!','proud',.95,1],['هههههههههههه!','laugh',.82,1.35],['أنا بكرا بنجح هالشغل يا شيخ!','tired',.92,1]];let x=items[tapIndex];$('bubble').textContent=x[0];animate(x[1]);say(x[0],x[2],x[3]);tapIndex=(tapIndex+1)%3}
function abuAction(n){if(n===0){$('bubble').textContent='أنا أبو أمير الملك!';animate('proud');say('أنا أبو أمير الملك!',.95,1)}else if(n===1){$('bubble').textContent='هههههههههههه!';animate('laugh');say('هههههههههههه!',.8,1.35)}else{$('bubble').textContent='أنا بكرا ماني جاي عالشغل يا شيخ!';animate('tired');say('أنا بكرا ماني جاي عالشغل يا شيخ!',.92,1)}}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1900)}
function update(){ $('coins').textContent=coins;$('level').textContent=level;$('weight').textContent=weight.toFixed(3);$('request').textContent='بدي '+target.toFixed(3)+' كيلو حلاوة جبن!';$('reward').textContent='المكافأة +'+(100+level*15)+' 🪙';$('goalText').textContent=mode==='open'?'اللعب المفتوح: استمر بالبيع':'الهدف: بيع '+(level*5)+' كيلو';$('progressText').textContent=mode==='open'?totalSold.toFixed(2)+' كيلو مباع':sold.toFixed(2)+' / '+(level*5)+' كيلو';$('bar').style.width=mode==='open'?Math.min(100,totalSold%5/5*100)+'%':Math.min(100,sold/(level*5)*100)+'%';$('modeLabel').textContent=mode==='open'?'اللعب المفتوح':'وضع المراحل'}
function adjust(delta){weight=Math.max(0,Math.min(5,Math.round((weight+delta)*1000)/1000));update()}
function nextOrder(){target=([.25,.5,.75,1,1.25,1.5,2][Math.floor(Math.random()*7)]);weight=0;update()}
function sell(){if(weight<=0){toast('حط حلاوة على الميزان أولاً!');say('يا معلم حط حلاوة عالميزان!');return}let diff=Math.abs(weight-target),accuracy=Math.max(0,1-diff/Math.max(target,.25));let base=100+level*15;let earned=Math.round(base*accuracy);if(diff<=.025){earned+=35;toast('وزن مضبوط! برافو عليك 👏');say('الله عليك يا معلم! وزن مضبوط!')}else if(diff<=.10){toast('بيع مقبول، حاول تضبط الوزن أكثر');say('مو بطال يا شيخ، بس بدها شوية دقة')}else{toast('الوزن بعيد عن الطلب، المكافأة أقل');say('يا لطيف! لخبطتلي الميزان يا شيخ!')}coins+=earned;totalSold+=weight;if(mode==='levels'){sold+=weight;if(sold>=level*5){sold-=level*5;level++;toast('مبروك! وصلت للمستوى '+level+' 🎉');say('مبروك يا معلم! فتحنا مستوى جديد!')}}animate('proud');$('bubble').textContent='يسلموا إيديك! نورتنا';update();setTimeout(nextOrder,900)}
function bonus(){coins+=200;update();toast('وصلتك 200 عملة تجريبية 🪙')}
function openShop(){$('modalTitle').textContent='تطوير محل أبو طارق';$('modalDesc').textContent='رصيدك '+coins+' عملة. اختار التطوير اللي بدك ياه.';$('modal').classList.add('show')}
function openPause(){$('modalTitle').textContent='استراحة أبو أمير';$('modalDesc').textContent='اللعبة متوقفة مؤقتاً. خذ نفس وارجع كمل!';$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function buyUpgrade(id,cost){if(upgrades.includes(id)){toast('التطوير موجود عندك بالفعل');return}if(coins<cost){toast('عملاتك ما بتكفي يا معلم');return}coins-=cost;upgrades.push(id);if(id==='lights'){$('shopBg').style.filter='brightness(.72) saturate(1.35)';toast('أضواء المحل صارت ملكية!')}if(id==='sign'){$('shopBg').style.filter='brightness(.68) saturate(1.25)';$('brand').style.textShadow='0 0 8px white,0 0 18px #d78cff,0 0 30px #8b2be2';toast('الأرمة صارت نيون!')}if(id==='display')toast('تطورت واجهة العرض!');$('modalDesc').textContent='مبروك! تم شراء التطوير';update()}
function setMode(m){mode=m;sold=0;update();toast(m==='open'?'بدأ اللعب المفتوح':'رجعنا لنظام المراحل')}
update();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));}</script>
</body>
</html>
